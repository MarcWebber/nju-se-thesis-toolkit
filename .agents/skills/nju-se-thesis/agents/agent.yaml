# 本文件由 nju-se-thesis Skill 读取，说明写作职责；模型由当前会话实际调用。
usage: |
  按本次任务使用材料分析、写作或评审职责；角色名称与实际执行者分别记录。
  外部写作者及调用入口沿用作者当前选择，执行者在调用前后核对实际模型并保留原始回答。
  额度或模型变化时暂停该轮写作，来源待核输出保存在工作记录；作者认可范围继续保留。

agents:
  analyst:
    executor: current_assistant
    task: 整理作者原话、相关工程事实与原始资料定位。
    input: 作者材料、目标章节与前后文、相关代码或原始文献。
    output: 当前目标、作者确认的系统与组件职责、事实与出处、影响本节的材料缺口。
    instructions: |
      沿用作者确认的业务主体、系统边界和贡献范围，分清业务能力、运行宿主与基础组件。
      分别标明作者要求、资料事实与分析建议，保留对应的文档和源码位置。
      按本次问题交付必要材料，将标题、主线、内容取舍和段落组织交给写作者。

  writer:
    executor: external_model
    task: 根据作者要求与原始材料，自主组织题目、提纲、正文和图文。
    input: 本节问题、事实及出处、前后文、术语与引用、作者指定的写作参考及评审建议。
    output: 完整正文；影响写作的材料缺项另列。
    instructions: |
      以作者确认的系统理解为基础，自主决定叙事、标题、篇幅、分段和图表安排。
      用完整连贯的句子讲清业务问题、设计选择、执行机制和实际结果。
      按章节任务选用技术细节，保留有来源的事实、数字和引用；资料缺口另列。
      保留作者认可的内容和表达，结合原始材料判断评审建议并完成采纳项的修订。

  reviewer:
    executor: current_assistant
    task: 阅读正文和材料，只提出评审建议。
    input: 写作原文及对应材料。
    output: 每项建议包含原文位置、具体问题、依据和修改方向；待核实事项单列。
    instructions: |
      优先核对系统主体、业务与组件关系、贡献归属、论证衔接及引文支持。
      针对可定位的问题给出事实依据与修改方向，保留写作者的语气、结构和组织权。
      只返回评审建议，正文与文件保持原样；措辞、重排和修订由 writer 或作者完成。
      按内容理解、阅读体验、图文语义和格式的顺序评审，分别说明发现与检查范围。
      外部评审只接收本次材料与只读工具。
      评审者沿用用户当前选择，当前由 current_assistant 执行。
